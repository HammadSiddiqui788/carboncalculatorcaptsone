        }

            margin: 15px 0;

        }
        .sidebar a:hover {
            text-decoration: underline;
        }
        .main {
            flex: 1;

        }

            font-size: 24px;

        label {

            margin-top: 20px;

        button {

            margin-top: 20px;

        }
    
body.dark {
    background-color: #121212;
    color: #e0e0e0;
}
body.dark .sidebar {
    background-color: #0d3b26;
}
body.dark .card, body.dark .form-section, body.dark .login-container {
    background-color: #1e1e1e !important;
    color: #e0e0e0;
}
body.dark h3, body.dark .header {
    color: #b2f2bb;
}
body.dark input, body.dark textarea, body.dark select {
    background-color: #2c2c2c;
    color: #fff;
    border-color: #555;
}

body {
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
}
body.loaded {
    opacity: 1;
}
.card, .form-section, .login-container {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover, .form-section:hover, .login-container:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}
button {
    transition: background-color 0.3s ease, transform 0.2s ease;
}
button:hover {
    background-color: #40916c;
    transform: scale(1.02);
}
input:focus, select:focus, textarea:focus {
    border-color: #95d5b2;
    box-shadow: 0 0 5px #95d5b2;
    outline: none;
}
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #2e7d32;
    color: white;
    padding: 12px 20px;
    border-radius: 6px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 9999;
}
.toast.show {
    opacity: 1;
    transform: translateY(0);
}

#bg-svg path {
  fill: #d8f3dc;
}
body.dark #bg-svg path {
  fill: #1b4332;
}
</style>

<div class="toast" id="toast"></div>
<div class="sidebar"><img src="ksbl-logo.png" style="width:100px; margin-bottom: 20px; display:block;"/>
<h2>Carbon Platform</h2>

<label style="color:white;">
<input id="darkToggle" style="margin-right: 8px;" type="checkbox"/>Dark Mode
</label>
</div>
<div class="main">
<div class="header">Credit Listing</div>
<div class="form-section">
<label for="projectName">Project Name</label>
<input id="projectName" placeholder="e.g., Urban Reforestation Drive" type="text"/>
<label for="description">Project Description</label>
<textarea id="description" placeholder="Describe the project and its carbon-saving impact"></textarea>
<label for="credits">Credits Available</label>
<input id="credits" placeholder="e.g., 7" type="number"/>
<label for="price">Price per Credit ($)</label>
<input id="price" placeholder="e.g., 15" type="number"/>
<button onclick="submitListing()">Submit Listing</button>
<div class="confirmation" id="confirmation" style="display:none;"></div>
</div>
</div>
<script>
        function submitListing() {
            const name = document.getElementById('projectName').value;
            const desc = document.getElementById('description').value;
            const credits = document.getElementById('credits').value;
            const price = document.getElementById('price').value;

            const msg = `Listing submitted for "${name}" with ${credits} credits at $${price}/credit.`;
            const confirmBox = document.getElementById('confirmation');
            confirmBox.innerText = msg;
            confirmBox.style.display = "block";
        }
    </script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("darkToggle");
    const isDark = localStorage.getItem("darkMode") === "true";
    if (isDark) {
        document.body.classList.add("dark");
        if (toggle) toggle.checked = true;
    }
    if (toggle) {
        toggle.addEventListener("change", function () {
            if (toggle.checked) {
                document.body.classList.add("dark");
                localStorage.setItem("darkMode", "true");
            } else {
                document.body.classList.remove("dark");
                localStorage.setItem("darkMode", "false");
            }
        });
    }
});
</script><script>
document.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("loaded");
    showToast("Page loaded!");
});
function showToast(message) {
    const toast = document.getElementById("toast");
    toast.innerText = message;
    toast.classList.add("show");
    setTimeout(() => {
        toast.classList.remove("show");
    }, 1000);
}
</script></body>
