</div>
<script>
        const factors = {
            "Company Transport": 0.21,
            "Fossil Fuels": 2.68,
            "Fugitive Emissions": 1.5,
            "Electricity Consumption - market-based": 0.74,
            "Green Tariff Electricity": 0.45,
            "Electricity Consumption - location-based": 0.67,
            "Materials": 1.9,
            "Third-Party Transport": 0.18,
            "Transmission and Distribution (T&D)": 0.12,
            "Waste": 0.96,
            "Water": 0.14,
            "Well-to-Tank (WTT)": 0.25
        };

        const scopes = {
            "Scope 1": ["Company Transport", "Fossil Fuels", "Fugitive Emissions"],
            "Scope 2": ["Electricity Consumption - market-based", "Green Tariff Electricity", "Electricity Consumption - location-based"],
            "Scope 3": ["Materials", "Third-Party Transport", "Transmission and Distribution (T&D)", "Waste", "Water", "Well-to-Tank (WTT)"]
        };

        const form = document.getElementById("calculator-form");
        let inputs = {};

        function renderForm() {
            for (const [scope, activities] of Object.entries(scopes)) {
                const title = document.createElement("h3");
                title.innerText = scope;
                form.appendChild(title);

                activities.forEach(activity => {
                    const label = document.createElement("label");
                    label.setAttribute("for", activity);
                    label.innerText = activity;

                    const input = document.createElement("input");
                    input.setAttribute("type", "number");
                    input.setAttribute("id", activity);
                    input.setAttribute("placeholder", "Enter quantity for " + activity);

                    input.addEventListener("input", calculate);

                    form.appendChild(label);
                    form.appendChild(input);
                    inputs[activity] = input;
                });
            }

            const btns = document.createElement("div");
            btns.className = "btns";
            btns.innerHTML = `
                <button onclick="saveData()">💾 Save</button>
                <button onclick="loadData()">📂 Load</button>
            `;
            form.appendChild(btns);

            const result = document.createElement("div");
            result.id = "output";
            result.className = "result-box";
            result.style.display = "none";
            form.appendChild(result);

            const suggestion = document.createElement("div");
            suggestion.id = "offset";
            suggestion.className = "offset";
            form.appendChild(suggestion);
        }

        function calculate() {
            let scope1 = 0, scope2 = 0, scope3 = 0;

            for (const [scope, activities] of Object.entries(scopes)) {
                activities.forEach(activity => {
                    const value = parseFloat(inputs[activity].value) || 0;
                    const emission = value * factors[activity];

                    if (scope === "Scope 1") scope1 += emission;
                    else if (scope === "Scope 2") scope2 += emission;
                    else if (scope === "Scope 3") scope3 += emission;
                });
            }

            const total = scope1 + scope2 + scope3;
            const output = document.getElementById("output");
            output.innerHTML = `
                Scope 1: ${scope1.toFixed(2)} tCO₂e<br>
                Scope 2: ${scope2.toFixed(2)} tCO₂e<br>
                Scope 3: ${scope3.toFixed(2)} tCO₂e<br>
                <strong>Total: ${total.toFixed(2)} tCO₂e</strong>
            `;
            output.style.display = "block";

            document.getElementById("offset").innerText = suggestOffset(total);
        }

        function suggestOffset(tons) {
            const trees = Math.ceil(tons * 4.5);
            return `🌱 Suggestion: Plant approximately ${trees} trees to offset total emissions.`;
        }

        function saveData() {
            const data = {};
            for (const key in inputs) {
                data[key] = inputs[key].value;
            }
            localStorage.setItem("advancedCarbonData", JSON.stringify(data));
            alert("Data saved!");
        }

        function loadData() {
            const data = JSON.parse(localStorage.getItem("advancedCarbonData") || "{}");
            for (const key in inputs) {
                if (data[key]) {
                    inputs[key].value = data[key];
                }
            }
            calculate();
        }

        renderForm();
    </script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("darkToggle");
    const isDark = localStorage.getItem("darkMode") === "true";
    if (isDark) {
        document.body.classList.add("dark");
        if (toggle) toggle.checked = true;
    }
    if (toggle) {
        toggle.addEventListener("change", function () {
            if (toggle.checked) {
                document.body.classList.add("dark");
                localStorage.setItem("darkMode", "true");
            } else {
                document.body.classList.remove("dark");
                localStorage.setItem("darkMode", "false");
            }
        });
    }
});
</script><script>
document.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("loaded");
    showToast("Page loaded!");
});
function showToast(message) {
    const toast = document.getElementById("toast");
    toast.innerText = message;
    toast.classList.add("show");
    setTimeout(() => {
        toast.classList.remove("show");
    }, 1000);
}
</script></body>
